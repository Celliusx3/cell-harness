[project]
name = "phone"
version = "0.1.0"
description = "MCP server: one Android phone in a microsandbox microVM, shared by every bot"
requires-python = ">=3.13"
dependencies = ["mcp>=2.1.1", "pydantic>=2", "microsandbox==0.7.13"]

[project.scripts]
phone = "phone.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.6"]

[tool.pytest.ini_options]
addopts = "--cov=phone --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["phone"]
omit = ["tests/*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["phone", "tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["phone"]
