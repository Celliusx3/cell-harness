[project]
name = "instagram"
version = "0.1.0"
description = "MCP server: read a shared Instagram reel into text observations"
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.1.1",
    "httpx>=0.28",
    "pydantic>=2",
    # Instagram rotates the `doc_id`; 4.15.3 is the version verified working (README).
    "instaloader==4.15.3",
]

[project.scripts]
instagram = "instagram.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
addopts = "--cov=instagram --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["instagram"]
omit = ["tests/*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["instagram", "tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["instagram"]
