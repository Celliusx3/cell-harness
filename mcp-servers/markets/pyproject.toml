[project]
name = "markets"
version = "0.1.0"
description = "MCP server: investment research data for US stocks/ETFs, crypto and Bursa Malaysia"
requires-python = ">=3.13"
dependencies = ["mcp>=2.1.1", "httpx>=0.28", "pydantic>=2", "yfinance>=1.7,<2"]

[project.scripts]
markets = "markets.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.6"]

[tool.pytest.ini_options]
addopts = "--cov=markets --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["markets"]
omit = ["tests/*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["markets", "tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["markets"]
