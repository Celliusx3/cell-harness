[project]
name = "places"
version = "0.1.0"
description = "MCP server: resolve a described place to a real POI via Google Places API (New)"
requires-python = ">=3.13"
dependencies = ["mcp>=2.1.1", "httpx>=0.28", "pydantic>=2"]

[project.scripts]
places = "places.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.6"]

[tool.pytest.ini_options]
addopts = "--cov=places --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["places"]
omit = ["tests/*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["places", "tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["places"]
