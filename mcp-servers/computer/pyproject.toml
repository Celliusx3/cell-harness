[project]
name = "computer"
version = "0.1.0"
description = "MCP server: a Linux desktop with Chrome in Docker, shared by every bot"
requires-python = ">=3.13"
dependencies = ["mcp>=2.1.1", "httpx>=0.28", "pydantic>=2"]

[project.scripts]
computer = "computer.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.6", "websockets>=15"]

[tool.pytest.ini_options]
addopts = "--cov=computer --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["computer"]
omit = ["tests/*", "computer/vendor/*"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["computer/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["computer", "tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["computer"]
