[project]
name = "cell-harness"
version = "0.1.0"
description = "An agent harness — event-sourced session log, capability seams, scoped registries"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "pydantic-settings>=2",
    "jinja2>=3.1",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "python-telegram-bot[rate-limiter]>=22.8",
    "discord.py>=2.7",
    "mcp>=2.1.1",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
addopts = "--cov=harness --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["harness"]
omit = ["tests/*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["harness", "tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]
