[project]
name = "cell-harness"
version = "0.1.0"
description = "An agent harness — event-sourced session log, capability seams, scoped registries"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "pydantic-settings>=2",
    "jinja2>=3.1",
]

# Phase-gated, added when the phase that needs them starts (PHASES.md):
#   phase 7  fastapi, uvicorn      — runs + SSE
#   phase 9  ripgrep binary        — glob/grep
#   phase 12 mcp                   — MCP client
#   phase 16 (frontend/ is npm)    — web UI
# Listing them here early would install weight nothing imports yet.

[project.scripts]
harness = "harness.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
addopts = "--cov=harness --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["harness"]
omit = ["tests/*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# Both are installed (the package, and tests as a namespace), so without this
# ruff sorts them among third-party imports and the grouping stops meaning
# anything.
known-first-party = ["harness", "tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]
